name: public-smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run smoke demo
        run: python examples/wave_field_demo.py
      - name: Reproduce Gate NL
        run: python experiments/gate-nl/reproduce.py --check-reference
      - name: Run tests
        run: python -m unittest discover -s tests -v
